plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

// Update version and archivesBaseName
version = '1.1.13' // Increment version
group = 'igentuman.blockbooster'

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

base {
    archivesName = 'BlockBooster-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Update runs configuration
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Update configurations
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { // JEI
        url "https://dvs1.progwml6.com/files/maven"
    }
    maven { // TOP
        url "https://cursemaven.com"
    }
    maven { url 'https://maven.blamejared.com' }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name 'Modmaven'
        url 'https://modmaven.dev/'
        content {
            includeGroup 'mekanism'
        }
    }
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven { url "https://maven.architectury.dev" }
}

// Update dependencies
dependencies {
    // Replace Forge with NeoForge
    implementation "net.neoforged:neoforge:${neo_version}"
    
    // Update annotation processor for Mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'org.spongepowered:mixin:0.8.5'
    
    // Update dependencies with NeoForge versions
    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    
    // Mekanism - update when NeoForge version is available
    if (project.hasProperty('mekanism_version')) {
        implementation "mekanism:Mekanism:${mekanism_version}"
    }
    
    // Botania - update when NeoForge version is available
    if (project.hasProperty('botania_version')) {
        compileOnly "vazkii.botania:Botania:${botania_version}:api"
        compileOnly "vazkii.botania:Botania:${botania_version}"
    }
    
    // Patchouli - update when NeoForge version is available
    if (project.hasProperty('patchouli_version')) {
        compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}:api"
        compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    }

    implementation "curse.maven:architectury-api-419699:5786327"
    
    // KubeJS - update when NeoForge version is available
    if (project.hasProperty('kubejs_version')) {
        implementation "curse.maven:kubejs-238086:${kubejs_version}"
    }
    
    // Rhino - update when NeoForge version is available
    if (project.hasProperty('rhino_version')) {
        implementation "curse.maven:rhino-416294:${rhino_version}"
    }
    
    // Masterful Machinery - update when NeoForge version is available
    // implementation "curse.maven:masterful-machinery-423476:NEOFORGE_VERSION"
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "blockbooster",
                "Specification-Vendor"    : "igentuman",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "igentuman",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

configurations {
    shaded {
        transitive = false
    }
}


// Add ProcessResources task for variable substitution
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}